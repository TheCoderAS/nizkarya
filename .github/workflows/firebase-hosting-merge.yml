name: Deploy site & Firebase rules
run-name: Deploy site & Firebase rules

# The web app is gone; `site/` is a static landing page with no build step.
# This workflow still owns the Firestore/RTDB rules and indexes deploy, which
# the Android app depends on.
on:
  push:
    branches:
      - main
    paths:
      - "site/**"
      - "firebase.json"
      - "firestore.rules"
      - "firestore.indexes.json"
      - "database.rules.json"
      - "storage.rules"
      - ".github/workflows/firebase-hosting-merge.yml"

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_NEXT_GEN_TRACK }}
          channelId: live
          projectId: next-gen-track

      # Runs after the Hosting deploy so a rules failure cannot block the site.
      # The Hosting action only publishes the static site, so Firestore and
      # Realtime Database rules/indexes must be deployed separately.
      # Requires the deploy service account to have the Service Usage Consumer
      # role (roles/serviceusage.serviceUsageConsumer) for the CLI's API
      # prechecks. Storage is omitted: the firebasestorage.googleapis.com API is
      # not enabled on the project (and storage.rules denies all access anyway).
      # To re-add: enable that API in the console, then append `storage` below.
      - name: Deploy Firestore & Realtime Database rules
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_NEXT_GEN_TRACK" > "$RUNNER_TEMP/service-account.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/service-account.json"
          npx --yes firebase-tools deploy \
            --only firestore:rules,firestore:indexes,database \
            --project next-gen-track \
            --non-interactive \
            --force
          rm -f "$RUNNER_TEMP/service-account.json"
        env:
          FIREBASE_SERVICE_ACCOUNT_NEXT_GEN_TRACK: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_NEXT_GEN_TRACK }}
