name: Android Release
run-name: Android Release

on:
  push:
    branches:
      - main
    paths:
      - "mobile/**"
      - ".github/workflows/android-release.yml"

permissions:
  contents: write

jobs:
  release:
    name: Build & publish debug release
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Inject google-services.json (if configured)
        env:
          GS_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GS_JSON" ]; then
            printf '%s' "$GS_JSON" > app/google-services.json
            echo "google-services.json injected"
          else
            echo "GOOGLE_SERVICES_JSON secret not set, building without Firebase runtime config"
          fi
      # major.minor come from mobile/version.properties so that moving them is a
      # deliberate, reviewable edit. The run number supplies the build
      # component: the release tag is derived from the version name, so two
      # releases must never produce the same one.
      - name: Compute version
        id: version
        run: |
          set -euo pipefail
          prop() {
            grep -E "^$1=" version.properties | head -1 | cut -d= -f2 | tr -d '[:space:]'
          }
          MAJOR=$(prop major)
          MINOR=$(prop minor)
          # Validated out here, not inside a helper: an `exit` within a command
          # substitution only leaves the subshell, so the bad value would be
          # captured and the step would fail later for an unrelated reason.
          for pair in "major:$MAJOR" "minor:$MINOR"; do
            if ! [[ "${pair#*:}" =~ ^[0-9]+$ ]]; then
              echo "::error::version.properties: ${pair%%:*} must be a whole number, got '${pair#*:}'"
              exit 1
            fi
          done
          BUILD=$GITHUB_RUN_NUMBER

          VERSION_NAME="$MAJOR.$MINOR.$BUILD"
          # Encodes the version and still rises monotonically, which Android
          # needs, as long as major and minor only ever go up.
          VERSION_CODE=$(( MAJOR * 1000000 + MINOR * 10000 + BUILD ))

          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION_NAME ($VERSION_CODE)"
      - name: Build signed debug APK
        run: |
          ./gradlew assembleDebug --stacktrace \
            -Pnizkarya.versionCode=${{ steps.version.outputs.code }} \
            -Pnizkarya.versionName=${{ steps.version.outputs.name }}
      - name: Rename APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk \
             "nizkarya-v${{ steps.version.outputs.name }}-debug.apk"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "android-v${{ steps.version.outputs.name }}" \
            "nizkarya-v${{ steps.version.outputs.name }}-debug.apk" \
            --title "NizKarya Android v${{ steps.version.outputs.name }}" \
            --notes "Automated debug release from merge to main (${GITHUB_SHA::7}). Signed with the shared debug-distribution key, so installs upgrade in place across releases."
