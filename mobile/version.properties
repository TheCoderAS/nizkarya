# Marketing version for the Android app.
#
# Bump `minor` for a release that adds features, `major` for a milestone or a
# breaking change. Both are deliberate edits, reviewed like any other change.
#
# The third component is not a patch level: it is the release workflow's run
# number. It has to be there because the release tag is derived from the
# version name, so two releases can never share one. It also guarantees
# versionCode keeps increasing, which Android requires for an in-place upgrade.
major=0
minor=5
